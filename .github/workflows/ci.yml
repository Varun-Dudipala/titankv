name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: maven

    # Unit tests, then integration tests that start real clusters (including the chaos test),
    # then the coverage check (at least 75% of lines).
    - name: mvn verify
      run: mvn -B verify

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-java-${{ matrix.java }}
        path: |
          target/surefire-reports/
          target/failsafe-reports/

    - name: Upload coverage report
      if: matrix.java == '21'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/site/jacoco/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build image
      run: docker build -t titankv:ci .
